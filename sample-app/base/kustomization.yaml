apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cert.yaml

configMapGenerator:
- name: sample-users-api-config
  behavior: create
  literals:
  - java_opts=-Xms512m -Xmx1024m
  - log_level=INFO
secretGenerator:
- name: sample-users-api-secret
  behavior: create
  literals:
  - foo=foosecret
